<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 滿版黃底：各平台會自己裁成圓形或圓角，所以不加圓角 -->
  <rect width="64" height="64" fill="#DEAE0B"/>
  <!-- 與 src/app/icon.svg 同一個圖案，以 (34.5, 33.5) 為中心縮成 0.85 倍。看得見的部分落在半徑 25 的圓內（連同與底色同色的徽章黃色描邊約 26），畫布半徑是 32，裁成圓形也不會切到「+」徽章 -->
  <g transform="translate(32 32) scale(.85) translate(-34.5 -33.5)">
    <rect x="10" y="14" width="40" height="38" rx="9" fill="#FDF7E1"/>
    <path d="M10 23a9 9 0 0 1 9-9h22a9 9 0 0 1 9 9v6H10z" fill="#5D3713"/>
    <rect x="17.5" y="8" width="6" height="12" rx="3" fill="#5D3713" stroke="#DEAE0B" stroke-width="2"/>
    <rect x="36.5" y="8" width="6" height="12" rx="3" fill="#5D3713" stroke="#DEAE0B" stroke-width="2"/>
    <g fill="#DEAE0B" opacity=".6">
      <rect x="16" y="34" width="6" height="6" rx="1.5"/><rect x="25" y="34" width="6" height="6" rx="1.5"/><rect x="34" y="34" width="6" height="6" rx="1.5"/>
      <rect x="16" y="43" width="6" height="6" rx="1.5"/><rect x="25" y="43" width="6" height="6" rx="1.5"/>
    </g>
    <circle cx="47" cy="47" r="11" fill="#5D3713" stroke="#DEAE0B" stroke-width="3"/>
    <path d="M47 41v12M41 47h12" stroke="#FDF7E1" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
